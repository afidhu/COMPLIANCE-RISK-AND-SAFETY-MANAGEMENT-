<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #061a33, #0b2a52);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .auth-card {
        background: #0f2f5e;
        border-radius: 18px;
        padding: 28px;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.55);
    }

    .title {
        text-align: center;
        font-weight: 600;
        margin-bottom: 18px;
    }

    .nav-tabs {
        border: none;
        justify-content: center;
        margin-bottom: 20px;
    }

    .nav-tabs .nav-link {
        color: #9ec5ff;
        border: none;
        font-weight: 500;
    }

    .nav-tabs .nav-link.active {
        background: #1e66ff;
        color: white;
        border-radius: 10px;
    }

    label {
        font-size: 13px;
        color: #b7d2ff;
        margin-bottom: 5px;
    }

    .form-control, .form-select {
        background: #0b1f3a;
        border: 1px solid #1c3f6e;
        color: white;
        border-radius: 10px;
        padding: 10px;
    }

    .form-control::placeholder {
        color: #7fa7d9;
    }

    .form-control:focus, .form-select:focus {
        background: #0b1f3a;
        color: white;
        border-color: #4da3ff;
        box-shadow: none;
    }

    .btn-primary {
        background: #1e66ff;
        border: none;
        padding: 10px;
        border-radius: 10px;
        font-weight: 500;
    }

    .btn-primary:hover {
        background: #154acc;
    }

    .small-text {
        font-size: 13px;
        color: #a9c6ff;
        text-align: center;
        margin-top: 10px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="auth-card">

    <h4 class="title">Facility Compliance System</h4>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">Login</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#register">Register</button>
        </li>
    </ul>

    <div class="tab-content">

        <!-- LOGIN -->
        <div class="tab-pane fade show active" id="login">

            <label>User ID</label>
            <input type="text" class="form-control mb-3" placeholder="Enter your user ID">

            <label>Email</label>
            <input type="email" class="form-control mb-3" placeholder="example@gmail.com">

            <label>Password</label>
            <input type="password" class="form-control mb-3" placeholder="Enter your password">

            <a href="../index.html">
                <button class="btn btn-primary w-100">Login</button>
            </a>

            <div class="small-text">Forgot password?</div>
        </div>

        <!-- REGISTER -->
        <div class="tab-pane fade" id="register">

            <label>User ID</label>
            <input type="text" class="form-control mb-3" placeholder="Create unique user ID">

            <label>Full Name</label>
            <input type="text" class="form-control mb-3" placeholder="Enter full name">

            <label>Email</label>
            <input type="email" class="form-control mb-3" placeholder="example@gmail.com">

            <label>Role</label>
            <select class="form-select mb-3">
                <option selected disabled>Select your role</option>
                <option>Admin</option>
                <option>Inspector</option>
                <option>Safety Officer</option>
                <option>Technician</option>
                <!-- <option>Compliance Officer</option> -->
            </select>

            <label>Password</label>
            <input type="password" class="form-control mb-3" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" class="form-control mb-3" placeholder="Re-enter password">

            <button class="btn btn-primary w-100">Create Account</button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
